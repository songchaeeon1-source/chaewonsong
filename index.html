'2026-12-20':{city:'카이로',short:'카이로',title:'카이로 도착',events:['07:55 IST 출발 · 09:20 CAI 도착','점심 · 카이로 성채 · 시장','피라미드뷰 카페','저녁 양고기 · 나일강 산책'],status:'원안'},
'2026-12-21':{city:'기자',short:'기자',title:'기자 피라미드',events:['기자 피라미드'],map:'Giza Pyramids',status:'원안'},
'2026-12-26':{city:'카이로',short:'카이로',title:'카이로',events:['자유 일정'],status:'원안'},
'2026-12-29':{city:'카이로',short:'카이로',title:'카이로',events:['자유 일정'],status:'원안'},
'2026-12-30':{city:'시와',short:'시와',type:'siwa',title:'시와 당일치기',events:['시와 당일치기'],pending:'투어 · 이동편 미정',status:'원안'},
'2026-12-31':{city:'카이로 · 이스탄불',short:'이스탄불',title:'카이로 출국 · 새해맞이',events:['점심','12:30 CAI 공항 도착','15:30 CAI 출발 · 19:05 IST 도착','새해 카운트다운'],status:'시트 기재'},
'2027-01-01':{city:'이스탄불',short:'이스탄불',title:'이스탄불 · 인천행 탑승',events:['식사 · 낮잠 · 카페 · 쇼핑','15:00 IST 공항 도착','17:05 IST 출발'],status:'시트 기재'},
'2027-01-02':{city:'인천',short:'귀국',title:'인천 도착',events:['08:55 ICN 도착'],status:'시트 기재'}
};
const south=[
{city:'룩소르',short:'룩소르',title:'룩소르',events:['카이로 → 룩소르','카르나크 · 룩소르 신전'],map:'Karnak Temple'},
{city:'룩소르 · 아스완',short:'룩소르',title:'룩소르 서안 · 아스완 이동',events:['왕가의 계곡 · 하트셉수트 신전','룩소르 → 아스완'],map:'Valley of the Kings'},
{city:'아스완',short:'아스완',title:'아스완',events:['필레 신전','펠루카 · 누비안 마을 후보'],map:'Philae Temple'},
{city:'아부심벨',short:'아부심벨',title:'아부심벨 · 카이로 복귀',events:['아스완 ↔ 아부심벨','아스완 → 카이로'],map:'Abu Simbel Temples'}
];
const calendarDates=Array.from({length:15},(_,i)=>new Date(Date.UTC(2026,11,19+i)).toISOString().slice(0,10));
let activeOption=1,selectedDate='2026-12-19';
function itinerary(option){
const days=structuredClone(base),start=option===1?22:25;
south.forEach((day,i)=>{days['2026-12-'+(start+i)]={...day,type:'south',status:'남부 날짜 원안 · 관광 순서 제안',pending:'국내 이동편 미정'};});
if(option===1){
days['2026-12-27']={city:'바하리야',short:'사막',type:'desert',title:'바하리야 사막투어',events:['바하리야 사막투어','흑사막 · 백사막 · 캠핑 후보'],status:'원안 · 세부 일정 제안'};
days['2026-12-28']={city:'사막 · 카이로',short:'사막',type:'desert',title:'사막 · 카이로 복귀',events:['백사막 일출','카이로 복귀'],status:'1박 2일 구성 제안'};
}else{
days['2026-12-22']={city:'바하리야',short:'사막',type:'desert',title:'바하리야 사막투어',events:['바하리야 사막투어','흑사막 · 백사막 · 캠핑 후보'],status:'날짜 변경 · 세부 일정 제안'};
days['2026-12-23']={city:'사막 · 카이로',short:'사막',type:'desert',title:'사막 · 카이로 복귀',events:['백사막 일출','카이로 복귀'],status:'1박 2일 구성'};
days['2026-12-24']={city:'카이로',short:'카이로',title:'카이로',events:['자유 일정'],status:'미정'};
}
return calendarDates.map(date=>({date,...days[date]}));
}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function shortDate(date){return date.slice(5,7)+'.'+date.slice(8,10);}
function weekday(date){return new Intl.DateTimeFormat('ko',{weekday:'short',timeZone:'UTC'}).format(new Date(date+'T00:00:00Z'));}
function cityKeys(day){
if(day.city.includes('아부심벨'))return ['abu'];
if(day.city.includes('룩소르'))return day.city.includes('아스완')?['luxor','aswan']:['luxor'];
if(day.city.includes('아스완'))return ['aswan'];
if(day.type==='desert')return ['desert'];
if(day.city.includes('시와'))return ['siwa'];
if(day.city.includes('이스탄불'))return day.city.includes('카이로')?['cairo','transit']:['transit'];
if(day.city==='인천')return ['transit'];
return ['cairo'];
}
const cityNames={cairo:'카이로',siwa:'시와',luxor:'룩소르',aswan:'아스완',abu:'아부심벨',desert:'바하리야',transit:'이동'};
function renderDetail(day){
const detail=document.getElementById('selected-day');detail.replaceChildren();
document.getElementById('panel-date').textContent=shortDate(day.date)+' '+weekday(day.date);
const title=el('h2','',day.title);title.id='detail-title';detail.append(title);
const tags=el('div','panel-tags');cityKeys(day).forEach(key=>tags.append(el('span','city-tag '+key,cityNames[key])));detail.append(tags);
const list=el('ul','panel-events');day.events.forEach(event=>list.append(el('li','',event)));detail.append(list);
if(day.pending)detail.append(el('p','pending',day.pending));
if(day.map){const links=el('div','detail-links'),map=el('a','','지도 보기');map.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(day.map);map.target='_blank';map.rel='noopener';links.append(map);detail.append(links);}
}
const dialog=document.getElementById('detail-dialog');
let returnFocusDate=null;
function openDetail(day){selectedDate=day.date;returnFocusDate=day.date;renderDetail(day);if(!dialog.open)dialog.showModal();document.body.classList.add('panel-open');render();}
function closeDetail(){dialog.close();}
document.getElementById('close-detail').addEventListener('click',closeDetail);
dialog.addEventListener('close',()=>{document.body.classList.remove('panel-open');render();const target=document.querySelector('[data-date="'+returnFocusDate+'"]');if(target)target.focus({preventScroll:true});});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDetail();}});
function render(){
document.querySelectorAll('[data-option]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.option)===activeOption)));
const days=itinerary(activeOption),grid=document.getElementById('calendar');grid.replaceChildren();
days.forEach(day=>{
const keys=cityKeys(day),cell=el('button','day '+keys[0]);cell.type='button';cell.dataset.date=day.date;cell.setAttribute('aria-pressed',String(dialog.open&&day.date===selectedDate));cell.setAttribute('aria-controls','detail-dialog');cell.setAttribute('aria-haspopup','dialog');cell.setAttribute('aria-label',shortDate(day.date)+' '+weekday(day.date)+' · '+day.title);
const date=el('span','date',shortDate(day.date));cell.append(date);
const tags=el('span','day-tags');keys.forEach(key=>tags.append(el('span','city-tag '+key,key==='transit'?day.short:day.city==='기자'?'기자':cityNames[key])));cell.append(tags);
const events=el('span','events');day.events.forEach(event=>events.append(el('span','event',event)));cell.append(events);if(day.conflict)cell.append(el('span','conflict','일정 겹침'));
cell.addEventListener('click',()=>openDetail(day));grid.append(cell);
});if(dialog.open)renderDetail(days.find(day=>day.date===selectedDate));
}
document.querySelectorAll('[data-option]').forEach(button=>button.addEventListener('click',()=>{activeOption=Number(button.dataset.option);render();}));
document.getElementById('print').addEventListener('click',()=>window.print());render();
</script></body></html>
